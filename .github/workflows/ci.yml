name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Framework self-test
        run: bash tests/run.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build framework image
        run: docker build -f docker/Dockerfile -t ccf:ci .
      - name: Self-test inside container
        run: docker run --rm ccf:ci bash tests/run.sh
      - name: Default command smoke test
        run: docker run --rm ccf:ci
      - name: Claude Code CLI present
        run: docker run --rm ccf:ci claude --version
      - name: Assert no secrets baked into image
        run: |
          docker run --rm ccf:ci sh -c '! test -e .ccf && ! test -d .git' \
            && echo "ok: image contains no .ccf or .git"
